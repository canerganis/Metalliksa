# DRAFT: `docker compose up` was never run (only `docker compose config`). The same runtime image was started with
# `docker run` and served /api/health; see docs/APPLICATION_PACKAGING_NOTES.md, "Docker verification".
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    environment:
      # Bind all container interfaces so the published port is reachable (the image default too). This turns the
      # login flow ON: open the one-time link from `docker compose logs app` (replace its port with the host port),
      # or set METALLIKSA_TOKEN. Every /api route except /api/health needs login.
      METALLIKSA_HOST: "0.0.0.0"
      AIRGAPPED: "1"
      METALLIKSA_LPBF_SOURCE_ROOT: /data/lpbf-sources
      METALLIKSA_LPBF_RUN_ROOT: /data/lpbf-runs
      METALLIKSA_LPBF_BUNDLE_ROOT: /data/lpbf-run-bundles
      METALLIKSA_JOB_ROOT: /data/lpbf-jobs
      RESEARCH_REGISTRY_DIR: /data/research-registry
    volumes:
      - metalliksa-data:/data
    healthcheck:
      # /api/health is unauthenticated, so the check works in login mode (/api/python/status would answer 401).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Verification run (lint, unit tests, build, CPU meltpool tests):
  #   docker compose --profile repro build repro
  repro:
    profiles: ["repro"]
    build:
      context: .
      target: verify

volumes:
  metalliksa-data:
