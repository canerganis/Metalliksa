name: Pages demo

# DRAFT / UNVERIFIED: this workflow has never run on GitHub. It publishes the static snapshot demo
# (docs/DEMO_STATIC_DESIGN.md). Snapshots are generated locally and committed; this workflow never
# runs Python and never regenerates them. Pages must be enabled by the maintainer first
# (Settings, Pages, source "GitHub Actions").

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'demo/snapshots/**'
      - 'scripts/demo/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the demo
        run: npm run build:demo
        env:
          VITE_BASE_PATH: /metalliksa/
      - name: Check the demo build
        run: node scripts/demo/check-demo-build.mjs --base /metalliksa/
      - name: Add the 404.html safety net
        run: cp dist-demo/index.html dist-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
